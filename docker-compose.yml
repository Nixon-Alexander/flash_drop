version: '1'

services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports: 
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env