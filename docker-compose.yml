version: "1"

services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    labels:
      - logging: "loki"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:80"
    labels:
      - logging: "loki"
    env_file:
      - ./frontend/.env

  loki:
    image: grafana/loki:3.7.0
    volumes:
      - ./monitoring/loki/loki-config.yaml:/mnt/config
      - loki-data:/loki
    ports:
      - "3100:3100"
    command: 
      - -config.file=/mnt/config/loki-config.yaml

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    command: 
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki

volumes:
  loki-data:
  alloy-data: