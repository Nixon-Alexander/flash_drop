version: "1"

services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env

